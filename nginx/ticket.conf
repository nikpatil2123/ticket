# Ticket app — Nginx reverse proxy
# Frontend (Next.js): localhost:3000
# Backend API (NestJS): localhost:3001

upstream ticket_frontend {
    server 127.0.0.1:3000;
}

upstream ticket_backend {
    server 127.0.0.1:3001;
}

server {
    listen 80;
    server_name yourdomain.com www.yourdomain.com;

    # Redirect root to /login as the first page
    location = / {
        return 302 /login;
    }

    # API routes -> NestJS backend
    location /v1/ {
        proxy_pass http://ticket_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support (BullMQ/health or future realtime)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Everything else -> Next.js frontend
    location / {
        proxy_pass http://ticket_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    client_max_body_size 20M;
}
