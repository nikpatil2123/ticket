version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    platform: linux/amd64
    container_name: ticket-backend
    restart: always
    env_file: .env
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - MONGO_URI=${MONGO_URI:-mongodb://mongodb:27017/ticket}
      - JWT_SECRET=${JWT_SECRET:-supersecretjwt}
      - FRONTEND_URL=http://localhost:3000
      - SMTP_EMAIL=${SMTP_EMAIL}
      - SMTP_APP_PASSWORD=${SMTP_APP_PASSWORD}
    networks:
      - ticket-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    platform: linux/amd64
    container_name: ticket-frontend
    restart: always
    env_file: .env
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=/v1
      - PORT=3000
    depends_on:
      - backend
    networks:
      - ticket-network

  mongodb:
    image: mongo:latest
    container_name: ticket-mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - ticket-network

  redis:
    image: redis:alpine
    container_name: ticket-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - ticket-network

networks:
  ticket-network:
    driver: bridge

volumes:
  mongodb_data:
  redis_data:
