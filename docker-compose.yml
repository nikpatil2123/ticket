version: '3.8'

services:
  mongodb:
    image: mongo:6.0
    container_name: ticket_mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - ticket_network

  redis:
    image: redis:7.0-alpine
    container_name: ticket_redis
    restart: always
    ports:
      - "6379:6379"
    networks:
      - ticket_network

  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    container_name: ticket_backend
    restart: always
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - MONGO_URI=mongodb://mongodb:27017/ticket_db
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_SECRET=${JWT_SECRET:-super_secret_key_change_me}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GOOGLE_REDIRECT_URI=${GOOGLE_REDIRECT_URI:-http://localhost:3001/v1/auth/google/callback}
    depends_on:
      - mongodb
      - redis
    networks:
      - ticket_network

  frontend:
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=http://localhost:3001
    container_name: ticket_frontend
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - ticket_network

networks:
  ticket_network:
    driver: bridge

volumes:
  mongodb_data:
